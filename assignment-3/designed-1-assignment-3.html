<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Art Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dot dot-left-top"></div>
    <div class="dot dot-left-bottom"></div>
    <div class="dot dot-right-middle"></div>
    <div class="dot dot-right-bottom"></div>

    <div class="main-wrapper">
        <div class="header">
            <h2>Explore Art Work</h2>
            <a href="#" class="see-all">See All</a>
        </div>

        <div class="flex-container">
            <div class="card">
                <img src="images/alexander-unsplash.jpg" alt="Monocular">
                <div class="card-info">
                    <span class="title">Monocular</span>
                    <span class="likes">54.8k ♡</span>
                </div>
                <button class="bid-btn">Place Bid</button>
            </div>
            
            <div class="card">
                <img src="images/damir-unsplash.jpg" alt="Horns Mask">
                <div class="card-info">
                    <span class="title">Horns Mask</span>
                    <span class="likes">32.4k ♡</span>
                </div>
                <button class="bid-btn">Place Bid</button>
            </div>

            <div class="card">
                <img src="images/hector-reye-unsplash.jpg" alt="Light Moon">
                <div class="card-info">
                    <span class="title">Light Moon</span>
                    <span class="likes">86.6k ♡</span>
                </div>
                <button class="bid-btn">Place Bid</button>
            </div>

             <div class="card">
                <img src="images/hector-unsplash.jpg" alt="Skull Wire">
                <div class="card-info">
                    <span class="title">Skull Wire</span>
                    <span class="likes">78.9k ♡</span>
                </div>
                <button class="bid-btn">Place Bid</button>
            </div>

            <div class="card">
                <img src="images/image.png" alt="Spiderman">
                <div class="card-info">
                    <span class="title">Spiderman</span>
                    <span class="likes">24.8k ♡</span>
                </div>
                <button class="bid-btn active">Place Bid</button> </div>

            <div class="card">
                <img src="images/joaquin-unsplash.jpg" alt="DeadPool">
                <div class="card-info">
                    <span class="title">DeadPool</span>
                    <span class="likes">59.7k ♡</span>
                </div>
                <button class="bid-btn">Place Bid</button>
            </div>

            <div class="card">
                <img src="images/matheus-unsplash.jpg" alt="White Eye">
                <div class="card-info">
                    <span class="title">White Eye</span>
                    <span class="likes">45.7k ♡</span>
                </div>
                <button class="bid-btn">Place Bid</button>
            </div>

             <div class="card">
                <img src="images/punto-unsplash.jpg" alt="Plastic Spinal">
                <div class="card-info">
                    <span class="title">Plastic Spinal</span>
                    <span class="likes">98.6k ♡</span>
                </div>
                <button class="bid-btn">Place Bid</button>
            </div>
        </div>
    </div>
</body>
</html>
