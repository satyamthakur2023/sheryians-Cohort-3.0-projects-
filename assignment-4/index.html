<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jon Daniel - Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="portfolio-container">
        
        <div class="sidebar-nav-outer">
            <span class="nav-item-rotated">Clients</span>
            <span class="nav-item-rotated">Research</span>
            <span class="nav-item-rotated">Portfolio</span>
            <span class="nav-item-rotated">Podcast</span>
        </div>

        <aside class="profile-card">
    <div class="sidebar-nav-inner">
        <span class="nav-item-active"><i class="fa-solid fa-bahai"></i> About Me</span>
    </div>

    <div class="avatar-container">
        <div class="avatar-ring-outer">
            <div class="avatar-ring-inner">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=80" alt="Jon Daniel" class="profile-img">
            </div>
        </div>
    </div>

    <div class="profile-info">
        <h1 class="profile-name">Im,<br>Jon Daniel</h1>
        
        <div class="profile-footer">
            <a href="mailto:inquiry@jondaniel.design" class="email-link">
                inquiry@jondaniel.design <i class="fa-regular fa-envelope"></i>
            </a>
            
            <div class="stamp-badge-container">
                <svg viewBox="0 0 100 100" width="56" height="56">
                    <path id="circlePath" d="M 50, 50 m -36, 0 a 36,36 0 1,1 72,0 a 36,36 0 1,1 -72,0" fill="none"/>
                    <text font-size="9" font-weight="800" fill="#000000">
                        <textPath href="#circlePath" letter-spacing="1.9">
                            • MY DESIGN PORTFOLIO • 2026
                        </textPath>
                    </text>
                </svg>
            </div>
        </div>
    </div>
</aside>
        <main class="dashboard-grid">
            
            <header class="grid-header">
                <h2 class="main-title">Portfolio<span class="accent">⌝</span></h2>
            </header>

            <div class="bento-card card-featured-video">
                <span class="corner-notch">⌝</span>
                <img src="https://images.unsplash.com/photo-1551028719-00167b16eac5?w=800&auto=format&fit=crop&q=80" alt="Flamingo Artwork Showcase Video Preview" class="video-thumbnail">
                <button class="play-action-btn" aria-label="Play Portfolio Reel">
                    <i class="fa-solid fa-play"></i>
                </button>
            </div>

            <div class="stats-stack-column">
                <div class="bento-card stat-subcard mint-variant">
                    <span class="corner-notch">⌝</span>
                    <h3 class="stat-number">251</h3>
                    <p class="stat-label">Projects</p>
                </div>
                <div class="bento-card stat-subcard purple-variant">
                    <span class="corner-notch">⌝</span>
                    <h3 class="stat-number">156</h3>
                    <p class="stat-label">Awards</p>
                </div>
            </div>

            <div class="bento-card card-client-partner">
                <span class="corner-notch">⌝</span>
                <div class="brand-center-icon">
                    <i class="fa-brands fa-apple"></i>
                </div>
                <p class="brand-footer-text">Clients</p>
            </div>

            <div class="bento-card card-split-recognition">
                <span class="corner-notch">⌝</span>
                <div class="split-left-dark">
                    <div class="sphere-3d-graphic"></div>
                </div>
                <div class="split-right-orange">
                    <h3 class="recognition-number">172</h3>
                    <p class="recognition-label">Global Design<br>Awards.</p>
                </div>
            </div>

        </main>
    </div>



    
</body>
</html>
