<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScaleX Insights & Blogs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            padding: 20px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            width: 100%;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 20px;
            opacity: 0.8;
        }

        .btn-get-started {
            background: #1a1a1a;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #333;
            cursor: pointer;
        }

        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
        }

        .hero h1 {
            font-size: 120px;
            font-weight: 600;
            margin-bottom: 40px;
            letter-spacing: -2px;
        }

        .filter-container {
            display: flex;
            gap: 12px;
            margin-bottom: 60px;
        }

        .filter-tab {
            padding: 10px 24px;
            border-radius: 30px;
            background: #1a1a1a;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }

        .filter-tab.active {
            background: #f7510a;
        }

        .blog-grid {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: 0 auto;
        }

        .blog-card {
            background: #120c0c;
            width: 360px;
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-image-wrapper {
            position: relative;
            width: 100%;
            height: 280px;
        }

        .card-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 24px;
        }

        .card-content {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .category-tag {
            background: rgba(255, 77, 0, 0.1);
            color: #ff4d00;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            width: fit-content;
        }

        .blog-card h2 {
            font-size: 22px;
            line-height: 1.3;
            font-weight: 500;
        }

        .date {
            color: #666;
            font-size: 14px;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <img src="logos.png" alt="ScaleX Logo" width="120">
        </div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Blogs</a></li>
            <li><a href="#">Contact Us</a></li>
        </ul>
        <button class="btn-get-started">Get Started</button>
    </nav>

    <header class="hero">
        <h1>Insights & Blogs</h1>
        
        <div class="filter-container">
            <div class="filter-tab active">All</div>
            <div class="filter-tab">Tech</div>
            <div class="filter-tab">SaaS</div>
            <div class="filter-tab">Marketing</div>
        </div>
    </header>

    <section class="blog-grid">
        <article class="blog-card">
            <div class="card-image-wrapper">
                <img src="https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&q=80&w=800" alt="Cocktail">
            </div>
            <div class="card-content">
                <span class="category-tag">Tech</span>
                <h2>The Ultimate Guide To SaaS Marketing</h2>
                <p class="date">May 23, 2025</p>
            </div>
        </article>

        <article class="blog-card">
            <div class="card-image-wrapper">
                <img src="https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&q=80&w=800" alt="Chair">
            </div>
            <div class="card-content">
                <span class="category-tag">SaaS</span>
                <h2>5 Key Trends In SaaS Growth For 2025</h2>
                <p class="date">May 23, 2025</p>
            </div>
        </article>

        <article class="blog-card">
            <div class="card-image-wrapper">
                <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&q=80&w=800" alt="Cat">
            </div>
            <div class="card-content">
                <span class="category-tag">Marketing</span>
                <h2>How Data-Driven Strategies Are Important</h2>
                <p class="date">May 23, 2025</p>
            </div>
        </article>
    </section>

</body>
</html>
